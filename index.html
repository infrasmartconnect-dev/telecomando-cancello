
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Telecomando Cancello</title>

  <style>
    * { box-sizing: border-box; }
  
    .pulsante {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 20px 12px;
  border-radius: 16px;
  background: #4f46e5;
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
}
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      background: #020617;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      text-align: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 28px;
      box-shadow: 0 20px 60px #0008;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 20px 12px;
      border: none;
      border-radius: 16px;
      background: #4f46e5;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #messaggio {
      min-height: 22px;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🏠</div>

    <h1>Telecomando Cancello</h1>
    <p>Controllo remoto del cancello</p>


<button class="pulsante" onclick="apriCancello()">
  APRI CANCELLO
</button>
<p id="messaggio">Pronto</p>


    <p id="messaggio">Pronto</p>
  </main>

 
<script>
async function apriCancello() {
  const password = prompt("Inserisci la password del telecomando");

  if (!password) return;

  const messaggio = document.getElementById("messaggio");

  if (!confirm("Vuoi inviare il comando di apertura?")) {
    return;
  }

  messaggio.textContent = "Invio del comando...";

  try {
    const risposta = await fetch(
      "https://telecomando-cancello.infrasmartconnect.workers.dev/api/apri",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password: password })
      }
    );

    const risultato = await risposta.json();

    if (!risposta.ok) {
      throw new Error(risultato.errore || "Richiesta rifiutata");
    }

    messaggio.textContent =
      "Comando inviato al sistema!";
  } catch (errore) {
    messaggio.textContent =
      "Errore: " + errore.message;
  }
}
</script>
</body>
</html>

  
</body>
